; https://docs.platformio.org/page/projectconf.html

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
lib_deps = 
	adafruit/DHT sensor library@^1.4.6
	ress997/TinyGPSPlusPlus@^0.0.4
	sandeepmistry/LoRa@^0.8.0

[env:esp32_c6_devkitm_1]
platform = espressif32
board = esp32-c6-devkitm-1
framework = espidf
lib_deps = 
	sandeepmistry/LoRa @ ^0.8.0
	ress997/TinyGPSPlusPlus @ ^0.0.4
	adafruit/DHT sensor library @ ^1.4.6
